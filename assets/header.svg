<svg width="100%" height="90" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional Linear Gradient -->
    <linearGradient id="proGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"> <!-- Slate 900 -->
        <animate attributeName="stop-color" values="#0f172a; #2563eb; #0f172a" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#334155"> <!-- Slate 700 -->
        <animate attributeName="stop-color" values="#334155; #1d4ed8; #334155" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a"> <!-- Slate 900 -->
        <animate attributeName="stop-color" values="#0f172a; #2563eb; #0f172a" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Text Element -->
  <text x="0" y="70" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="60" 
        letter-spacing="-1.5" 
        fill="url(#proGradient)">
    ADVOCAT
  </text>
</svg>
