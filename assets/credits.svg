<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f260" />
      <stop offset="100%" stop-color="#0575e6" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;700&amp;display=swap');
      
      .card-bg {
        fill: #0f172a;
        stroke: url(#neonGrad);
        stroke-width: 2;
        rx: 15;
      }
      
      .name {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 40px;
        fill: #ffffff;
        filter: url(#glow);
        opacity: 0;
        animation: fadeIn 1s ease-out forwards 0.5s;
      }
      
      .role {
        font-family: 'Outfit', sans-serif;
        font-weight: 300;
        font-size: 20px;
        fill: #94a3b8;
        opacity: 0;
        animation: slideIn 1s ease-out forwards 1s;
      }
      
      .cursor {
        fill: #00f260;
        animation: blink 1s infinite;
      }
      
      .border-trace {
        fill: none;
        stroke: #00f260;
        stroke-width: 3;
        stroke-dasharray: 200 600;
        stroke-dashoffset: 800;
        rx: 15;
        animation: trace 4s linear infinite;
      }
      
      @keyframes trace {
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      
      @keyframes slideIn {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Dark Glass Card -->
  <rect x="50" y="20" width="700" height="160" class="card-bg" fill-opacity="0.8" />
  
  <!-- Animated Border Tracer -->
  <rect x="50" y="20" width="700" height="160" class="border-trace" />

  <!-- Content -->
  <text x="50%" y="45%" text-anchor="middle" class="name">SANTHOSH REDDY</text>
  <text x="50%" y="65%" text-anchor="middle" class="role">Lead Developer &amp; Software Architect</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="2" fill="#334155" />
  <circle cx="700" cy="100" r="2" fill="#334155" />
</svg>
