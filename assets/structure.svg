<svg width="100%" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .text { font-family: 'Consolas', 'Monaco', 'Andale Mono', 'Ubuntu Mono', monospace; font-size: 14px; }
    .tree { fill: #30363d; }
    .dir { fill: #58a6ff; font-weight: bold; }
    .comment { fill: #8b949e; font-style: italic; }
  </style>
  
  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="800" height="340" rx="8" class="bg" stroke="#30363d" stroke-width="1"/>
  
  <!-- Window Controls (Pro Look) -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  
  <text x="30" y="60" class="text">
    <tspan class="dir">src/</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">components/</tspan><tspan class="comment" x="250">      # Reusable UI primitives</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">context/</tspan><tspan class="comment" x="250">         # React Context providers</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">data/</tspan><tspan class="comment" x="250">            # Static legal definitions (BNS, IPC)</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">features/</tspan><tspan class="comment" x="250">        # Domain logic &amp; Business rules</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">models/</tspan><tspan class="comment" x="250">          # TypeScript interfaces &amp; types</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">navigation/</tspan><tspan class="comment" x="250">      # Stack and Tab infrastructure</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">screens/</tspan><tspan class="comment" x="250">         # Feature-specific view controllers</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">services/</tspan><tspan class="comment" x="250">        # External I/O (Storage, Backup)</tspan>
    
    <tspan x="30" dy="24" class="tree">├── </tspan><tspan class="dir">store/</tspan><tspan class="comment" x="250">           # Global state (Zustand)</tspan>
    
    <tspan x="30" dy="24" class="tree">└── </tspan><tspan class="dir">theme/</tspan><tspan class="comment" x="250">           # Design system tokens</tspan>
  </text>
</svg>
