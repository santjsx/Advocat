name: Build & Release Android APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APK to (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 6. Install Node dependencies
        run: npm ci

      - name: 7. Generate Android Native Project via Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 8. Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 9. Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: 10. Prepare Release Artifact
        id: prep
        run: |
          # Resolve target release tag name
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v2.0.0"
          fi

          echo "Target tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # Find the built release APK
          SOURCE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SOURCE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          TARGET_APK="Advocat-${TAG_NAME}.apk"
          cp "$SOURCE_APK" "$TARGET_APK"
          echo "Output APK file: $TARGET_APK ($(ls -lh "$TARGET_APK" | awk '{print $5}'))"
          echo "apk_file=$TARGET_APK" >> "$GITHUB_OUTPUT"

      - name: 11. Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.apk_file }}
          path: ${{ steps.prep.outputs.apk_file }}
          retention-days: 30

      - name: 12. Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          files: ${{ steps.prep.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
